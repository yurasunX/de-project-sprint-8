[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-campaign-streaming"
version = "1.0.0"
description = "Restaurant campaign notifications using Spark, Kafka and PostgreSQL"
requires-python = ">=3.9,<3.13"
dependencies = ["pyspark==3.5.6", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
